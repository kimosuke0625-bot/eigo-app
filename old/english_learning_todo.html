<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英語マスター365</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英語365">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text y='.9em' font-size='75' x='12'>🇺🇸</text></svg>">
<style>
:root {
  --bg: #f0f4ff;
  --surface: #ffffff;
  --surface2: #f8faff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text2: #64748b;
  --primary: #6366f1;
  --primary-light: #eef2ff;
  --success: #22c55e;
  --success-light: #f0fdf4;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --danger: #ef4444;
  --p1: #22c55e; --p1-light: #f0fdf4;
  --p2: #3b82f6; --p2-light: #eff6ff;
  --p3: #a855f7; --p3-light: #faf5ff;
  --p4: #f97316; --p4-light: #fff7ed;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #162032;
  --border: #334155;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --primary: #818cf8;
  --primary-light: #1e1b4b;
  --success: #4ade80;
  --success-light: #052e16;
  --warning: #fbbf24;
  --warning-light: #1c1006;
  --p1-light: #052e16; --p2-light: #172554;
  --p3-light: #2e1065; --p4-light: #1c1106;
  --shadow: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

/* Header */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); flex: 1; min-width: 200px; }
.header-stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stat-badge { background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
.streak-badge { background: linear-gradient(135deg,#ff6b35,#f7c59f); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
.theme-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 1rem; color: var(--text); transition: all 0.2s; }
.theme-btn:hover { background: var(--primary-light); }

/* Main Layout */
.container { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

/* Start Setup */
.setup-card { background: var(--surface); border-radius: var(--radius); padding: 32px; text-align: center; box-shadow: var(--shadow-lg); max-width: 480px; margin: 60px auto; }
.setup-card h2 { font-size: 1.6rem; margin-bottom: 8px; color: var(--primary); }
.setup-card p { color: var(--text2); margin-bottom: 24px; }
.setup-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; background: var(--bg); color: var(--text); margin-bottom: 16px; }
.setup-card input:focus { outline: none; border-color: var(--primary); }
.btn-primary { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }

/* Progress Overview */
.progress-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.progress-card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.progress-card .label { font-size: 0.75rem; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.progress-card .value { font-size: 1.6rem; font-weight: 800; color: var(--text); }
.progress-card .sub { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.progress-bar-wrap { background: var(--border); border-radius: 99px; height: 6px; margin-top: 8px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

/* Today's Card */
.today-card { background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 20px; color: white; box-shadow: var(--shadow-lg); }
.today-card .day-label { font-size: 0.85rem; opacity: 0.85; font-weight: 600; }
.today-card .day-title { font-size: 1.3rem; font-weight: 800; margin: 4px 0 8px; }
.today-card .day-theme { font-size: 0.9rem; opacity: 0.9; }
.today-progress { margin-top: 12px; }
.today-progress .prog-text { font-size: 0.8rem; opacity: 0.9; margin-bottom: 4px; }
.today-progress .bar { background: rgba(255,255,255,0.3); border-radius: 99px; height: 8px; }
.today-progress .bar-fill { background: white; height: 100%; border-radius: 99px; transition: width 0.4s; }

/* Phase Tabs */
.phase-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
.phase-tab { padding: 8px 16px; border-radius: 99px; border: 2px solid var(--border); background: var(--surface); color: var(--text2); font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.phase-tab.active { color: white; border-color: transparent; }
.phase-tab[data-phase="0"].active { background: var(--primary); }
.phase-tab[data-phase="1"].active { background: var(--p1); }
.phase-tab[data-phase="2"].active { background: var(--p2); }
.phase-tab[data-phase="3"].active { background: var(--p3); }
.phase-tab[data-phase="4"].active { background: var(--p4); }

/* Week Section */
.week-section { background: var(--surface); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); }
.week-header { padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 12px; user-select: none; transition: background 0.2s; }
.week-header:hover { background: var(--surface2); }
.week-badge { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; color: white; flex-shrink: 0; }
.week-info { flex: 1; }
.week-title { font-weight: 700; font-size: 0.95rem; }
.week-sub { font-size: 0.78rem; color: var(--text2); margin-top: 2px; }
.week-progress { text-align: right; }
.week-pct { font-size: 0.85rem; font-weight: 700; }
.week-chevron { font-size: 0.8rem; color: var(--text2); transition: transform 0.3s; }
.week-section.open .week-chevron { transform: rotate(180deg); }
.week-days { display: none; border-top: 1px solid var(--border); }
.week-section.open .week-days { display: block; }

/* Day */
.day-section { border-bottom: 1px solid var(--border); }
.day-section:last-child { border-bottom: none; }
.day-header { padding: 12px 18px 12px 56px; cursor: pointer; display: flex; align-items: center; gap: 10px; background: var(--surface2); transition: background 0.2s; }
.day-header:hover { background: var(--bg); }
.day-num { font-size: 0.75rem; font-weight: 700; color: var(--text2); min-width: 42px; }
.day-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
.day-done-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.day-done-badge.complete { background: var(--success-light); color: var(--success); }
.day-done-badge.partial { background: var(--warning-light); color: var(--warning); }
.day-done-badge.todo { background: var(--border); color: var(--text2); }
.day-tasks { display: none; padding: 8px 18px 14px 56px; }
.day-section.open .day-tasks { display: block; }

/* Task Item */
.task-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); margin-bottom: 4px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
.task-item:hover { background: var(--surface2); border-color: var(--border); }
.task-item.done { opacity: 0.6; }
.task-checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: var(--surface); }
.task-item.done .task-checkbox { background: var(--success); border-color: var(--success); }
.task-checkbox::after { content: ''; width: 10px; height: 7px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg) scale(0); transition: transform 0.15s; position: relative; top: -1px; }
.task-item.done .task-checkbox::after { transform: rotate(-45deg) scale(1); }
.task-content { flex: 1; min-width: 0; }
.task-header { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
.task-icon { font-size: 1rem; }
.task-type-badge { font-size: 0.7rem; padding: 1px 7px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.task-time { font-size: 0.72rem; color: var(--text2); }
.task-text { font-size: 0.88rem; color: var(--text); line-height: 1.4; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text2); }

/* Type colors */
.type-Quizlet { background: #fef3c7; color: #92400e; }
.type-発音 { background: #fee2e2; color: #991b1b; }
.type-シャドーイング { background: #dbeafe; color: #1e40af; }
.type-リスニング { background: #d1fae5; color: #065f46; }
.type-スピーキング { background: #ede9fe; color: #5b21b6; }
.type-文法 { background: #fce7f3; color: #9d174d; }
.type-表現 { background: #e0f2fe; color: #075985; }
.type-記録 { background: #f0fdf4; color: #166534; }
.type-ディクテーション { background: #fff7ed; color: #9a3412; }
.type-多読 { background: #f5f3ff; color: #6d28d9; }
.type-鑑賞 { background: #fdf4ff; color: #7e22ce; }
.type-準備 { background: #f1f5f9; color: #475569; }
.type-計画 { background: #ecfeff; color: #164e63; }
[data-theme="dark"] .type-Quizlet { background: #292013; color: #fbbf24; }
[data-theme="dark"] .type-発音 { background: #1f1010; color: #f87171; }
[data-theme="dark"] .type-シャドーイング { background: #0f1e3a; color: #93c5fd; }
[data-theme="dark"] .type-リスニング { background: #052019; color: #6ee7b7; }
[data-theme="dark"] .type-スピーキング { background: #1a1030; color: #c4b5fd; }
[data-theme="dark"] .type-文法 { background: #200c1a; color: #f9a8d4; }
[data-theme="dark"] .type-表現 { background: #0a1f2e; color: #7dd3fc; }
[data-theme="dark"] .type-記録 { background: #0a1f10; color: #86efac; }
[data-theme="dark"] .type-ディクテーション { background: #1f0e06; color: #fb923c; }
[data-theme="dark"] .type-多読 { background: #150d2e; color: #a78bfa; }
[data-theme="dark"] .type-鑑賞 { background: #1c0d26; color: #d8b4fe; }
[data-theme="dark"] .type-準備 { background: #141c24; color: #94a3b8; }
[data-theme="dark"] .type-計画 { background: #061520; color: #67e8f9; }
.type-復習 { background: #d1fae5; color: #065f46; }
[data-theme="dark"] .type-復習 { background: #052e16; color: #6ee7b7; }

/* Task Detail */
.task-detail-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 0.7rem; color: var(--text2); cursor: pointer; margin-top: 6px; transition: all 0.15s; }
.task-detail-btn:hover, .task-detail-btn.open { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.task-detail-panel { display: none; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 8px; animation: detailFade 0.15s ease; }
.task-detail-panel.open { display: block; }
@keyframes detailFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.detail-section { margin-bottom: 10px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-label { font-size: 0.7rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.detail-text { font-size: 0.83rem; color: var(--text); line-height: 1.6; }
.detail-methods { list-style: none; padding: 0; margin: 4px 0 0; }
.detail-methods li { font-size: 0.82rem; color: var(--text); line-height: 1.6; padding-left: 14px; position: relative; }
.detail-methods li::before { content: "▸"; position: absolute; left: 0; color: var(--primary); font-size: 0.7rem; top: 3px; }
.detail-tip { font-size: 0.81rem; background: var(--primary-light); color: var(--primary); padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--primary); line-height: 1.5; margin-top: 4px; }

/* Confetti */
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
.confetti-piece { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: confetti-fall 1.5s ease-in forwards; }
@keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

/* Complete flash */
@keyframes checkFlash { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
.task-item.just-done .task-checkbox { animation: checkFlash 0.3s ease; }

/* Filter bar */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Reset btn */
.reset-btn { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; color: var(--text2); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
.reset-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

/* Today marker */
.today-marker { background: linear-gradient(135deg,var(--primary),#8b5cf6); color: white; font-size: 0.7rem; font-weight: 700; padding: 1px 6px; border-radius: 99px; }

/* Phase info banner */
.phase-banner { border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; border-left: 4px solid; }
.phase-banner h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.phase-banner p { font-size: 0.85rem; opacity: 0.9; }

/* Responsive */
@media (max-width: 600px) {
  .day-header { padding-left: 36px; }
  .day-tasks { padding-left: 36px; }
  .progress-overview { grid-template-columns: repeat(2, 1fr); }
}

/* Scroll to today btn */
.scroll-today-btn { position: fixed; bottom: 24px; right: 24px; background: var(--primary); color: white; border: none; border-radius: 99px; padding: 12px 20px; font-size: 0.88rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,0.4); z-index: 50; transition: all 0.2s; }
.scroll-today-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.5); }

/* ===== TIMER ===== */
.task-timer { display:flex; align-items:center; gap:6px; margin-top:8px; padding-top:6px; border-top:1px dashed var(--border); }
.timer-btn { background:var(--primary-light); color:var(--primary); border:1.5px solid var(--primary); border-radius:7px; padding:3px 11px; font-size:0.8rem; cursor:pointer; transition:all 0.18s; font-weight:700; line-height:1.6; }
.timer-btn:hover { background:var(--primary); color:white; }
.timer-btn.running { background:var(--danger); color:white; border-color:var(--danger); }
.timer-display { font-size:0.88rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text2); min-width:46px; text-align:center; letter-spacing:0.04em; transition:color 0.3s; }
.timer-display.running { color:var(--primary); }
.timer-display.urgent { color:var(--danger) !important; animation:pulse-t 0.6s ease-in-out infinite; }
.timer-display.finished { color:var(--success) !important; }
.timer-reset { background:none; border:1px solid var(--border); border-radius:7px; padding:3px 9px; font-size:0.8rem; cursor:pointer; color:var(--text2); transition:all 0.18s; line-height:1.6; }
.timer-reset:hover { background:var(--surface2); color:var(--text); }
.task-item.done .task-timer { opacity:0.4; pointer-events:none; }
@keyframes pulse-t { 0%,100%{opacity:1} 50%{opacity:0.25} }

/* ===== FACT MODAL ===== */
.fact-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.52); z-index:600; display:flex; align-items:flex-end; justify-content:center; animation:fOverlayIn 0.22s ease; }
.fact-overlay.closing { animation:fOverlayOut 0.22s ease forwards; }
.fact-card { background:var(--surface); border-radius:22px 22px 0 0; padding:26px 22px 38px; max-width:500px; width:100%; box-shadow:0 -10px 40px rgba(0,0,0,0.25); animation:fCardUp 0.42s cubic-bezier(0.34,1.56,0.64,1); position:relative; overflow:hidden; }
.fact-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--primary),#8b5cf6,#3b82f6); }
.fact-tag { font-size:0.72rem; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.fact-emoji-big { font-size:3rem; display:block; margin-bottom:10px; animation:fEmojiPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.12s both; }
.fact-body { font-size:0.95rem; color:var(--text); line-height:1.7; margin-bottom:20px; font-weight:500; }
.fact-count { font-size:0.75rem; color:var(--text2); margin-bottom:14px; }
.fact-close { width:100%; background:linear-gradient(135deg,var(--primary),#8b5cf6); color:white; border:none; border-radius:12px; padding:13px; font-size:0.95rem; font-weight:800; cursor:pointer; transition:all 0.2s; letter-spacing:0.02em; }
.fact-close:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(99,102,241,0.5); }
.fact-progress-bar { height:3px; background:var(--border); border-radius:99px; margin-top:14px; overflow:hidden; }
.fact-progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),#8b5cf6); border-radius:99px; width:100%; transition:width 0.12s linear; }
.fact-sparkle { position:absolute; pointer-events:none; font-size:1.2rem; animation:fSparkle 1.2s ease-out forwards; }
@keyframes fOverlayIn  { from{opacity:0} to{opacity:1} }
@keyframes fOverlayOut { from{opacity:1} to{opacity:0} }
@keyframes fCardUp  { from{transform:translateY(110%)} to{transform:translateY(0)} }
@keyframes fEmojiPop { from{transform:scale(0.2) rotate(-20deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
@keyframes fSparkle { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0.3)} }


/* ===== DAILY COMPLETE MODAL ===== */
.daily-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:700; display:flex; align-items:center; justify-content:center; animation:fOverlayIn 0.3s ease; padding:16px; }
.daily-overlay.closing { animation:fOverlayOut 0.25s ease forwards; }
.daily-card { background:var(--surface); border-radius:22px; padding:32px 24px 28px; max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.35); animation:fCardCenter 0.5s cubic-bezier(0.34,1.56,0.64,1); position:relative; overflow:hidden; text-align:center; }
.daily-card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,#22c55e,#6366f1,#f59e0b,#ef4444,#22c55e); background-size:200%; animation:shimmer 2s linear infinite; }
.daily-trophy { font-size:3.5rem; display:block; animation:fEmojiPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; margin-bottom:8px; }
.daily-title { font-size:1.3rem; font-weight:900; color:var(--text); margin-bottom:6px; }
.daily-sub { font-size:0.82rem; color:var(--text2); margin-bottom:20px; font-weight:600; }
.daily-quote-emoji { font-size:2rem; display:block; margin-bottom:10px; }
.daily-quote-text { font-size:1rem; color:var(--text); line-height:1.7; font-weight:500; font-style:italic; margin-bottom:8px; }
.daily-quote-author { font-size:0.82rem; color:var(--primary); font-weight:700; margin-bottom:22px; }
.daily-close-btn { width:100%; background:linear-gradient(135deg,#22c55e,#16a34a); color:white; border:none; border-radius:12px; padding:13px; font-size:0.95rem; font-weight:800; cursor:pointer; transition:all 0.2s; letter-spacing:0.02em; }

    ]
  ];
  phases.forEach(function(phase, phaseIdx) {
    var templates = reviewByPhase[phaseIdx] || reviewByPhase[0];
    phase.weeks.forEach(function(week) {
      week.days.forEach(function(day) {
        var variant = day.day % 2;
        day.tasks.push({
          id: "review-d" + day.day,
          time: "15分",
          type: "復習",
          icon: "🔄",
          content: templates[variant]
        });
      });
    });
  });
}

function generateWeekDays(weekNum, startDay, dayTemplates) {
  return dayTemplates.map((tmpl, i) => ({
    day: startDay + i,
    theme: tmpl.theme,
    tasks: tmpl.tasks.map((t, j) => {
      if (typeof t === 'string') {
        const types = ["Quizlet","シャドーイング","リスニング","スピーキング","発音","文法","表現","記録"];
        const icons = ["🃏","🎭","👂","🎤","🗣️","📖","💬","📝"];
        let type = "学習", icon = "📚", time = "20分";
        for (let k=0;k<types.length;k++) {
          if (t.includes(types[k])) { type=types[k]; icon=icons[k]; break; }
        }
        const timeMatch = t.match(/(\d+)分/);
        if (timeMatch) time = timeMatch[0];
        return { id:`d${startDay+i}t${j+1}`, time, type, icon, content: t };
      }
      return t;
    })
  }));
}

function generatePhaseWeeks(phaseId, startDay, endDay, weekThemes) {
  const weeks = [];
  let dayNum = startDay;
  const taskTemplates = {
    2: [
      ["Quizlet 20語 + 復習（Sentence Mining開始）","シャドーイング30分（ドラマ素材）","Language Reactorでドラマ視聴30分","オンライン英会話25分（週2〜3回）","リスニング精度チェック・ディクテーション"],
      ["Quizlet 20語（センテンスマイニング）","シャドーイング（TED Talks素材）","ポッドキャスト30分（6 Min English等）","独り言英語 + 英語日記","進捗確認・週次振り返り"]
    ],
    3: [
      ["Quizlet復習中心（新規10語）","シャドーイング20分","オンライン英会話25分（週3〜4回）","英語日記（150語）","スピーキング録音・自己評価"],
      ["多読30分（Graded Readers L3〜4）","ポッドキャスト（中〜上級）","アウトプット強化（プレゼン・モノローグ）","AIとの英会話（テキスト・音声）","週次振り返り・目標見直し"]
    ],
    4: [
      ["Quizlet復習（週3回）","ドラマ・映画（字幕なし挑戦）","オンライン英会話25分（週3〜4回）","英語SNS・コミュニティ参加","進捗確認・TOEIC模試等"],
      ["多読・多聴（上級素材）","スピーキング：長時間フリートーク","専門分野英語強化","総合力チェック","週次振り返り"]
    ]
  };

  weekThemes.forEach((weekDef, wi) => {
    const weekTheme = typeof weekDef === 'string' ? weekDef : weekDef.theme;
    const weekTasks = typeof weekDef === 'object' && weekDef.tasks ? weekDef.tasks : null;
    const days = [];
    const tpls = taskTemplates[phaseId];
    const dayThemes = [
      `Week スタート：${weekTheme}`,
      `${weekTheme}：実践②`,
      `${weekTheme}：深化③`,
      `${weekTheme}：強化④`,
      `${weekTheme}：チャレンジ⑤`,
      `${weekTheme}：精度UP⑥`,
      `週次振り返り・充電`
    ];
    for (let di=0; di<7; di++) {
      if (dayNum > endDay) break;
      let tasks;
      if (weekTasks && di < weekTasks.length) {
        // Use specific week tasks for the first N days
        const taskContent = weekTasks[di % weekTasks.length];
        tasks = [{id:`d${dayNum}t1`, time:"15分", type:"Quizlet", icon:"🃏", content:"Quizlet：今日の復習 + 新規語彙"},
                 {id:`d${dayNum}t2`, time:"20分", type:getTypeFromText(taskContent), icon:getIconFromText(taskContent), content:taskContent}];
        // Fill remaining with template
        const tpl = tpls[di%2];
        tpl.slice(1).forEach((t,j) => {
          tasks.push({id:`d${dayNum}t${j+3}`, time:"20分", type:getTypeFromText(t), icon:getIconFromText(t), content:t});
        });
      } else {
        const tpl = tpls[di%2];
        tasks = tpl.map((t,j)=>({id:`d${dayNum}t${j+1}`, time:"20分", type:getTypeFromText(t), icon:getIconFromText(t), content:t}));
      }
      days.push({ day: dayNum, theme: dayThemes[di] || `${weekTheme}：Day ${di+1}`, tasks });
      dayNum++;
    }
    weeks.push({ week: 13+wi+(phaseId-2)*13, theme: weekTheme, days });
  });
  return weeks;
}

function getTypeFromText(t) {
  const types = ["Quizlet","シャドーイング","リスニング","スピーキング","発音","文法","多読","ディクテーション","記録","計画"];
  for (const tp of types) if (t.includes(tp)) return tp;
  return "学習";
}
function getIconFromText(t) {
  if (t.includes("Quizlet")) return "🃏";
  if (t.includes("シャドー")) return "🎭";
  if (t.includes("リスニング") || t.includes("ポッドキャスト") || t.includes("多聴")) return "👂";
  if (t.includes("スピーキング") || t.includes("会話") || t.includes("フリートーク")) return "🎤";
  if (t.includes("発音")) return "🗣️";
  if (t.includes("文法")) return "📖";
  if (t.includes("多読") || t.includes("読書")) return "📚";
  if (t.includes("ディクテーション")) return "✏️";
  if (t.includes("日記") || t.includes("記録") || t.includes("振り返り")) return "📝";
  if (t.includes("映画") || t.includes("ドラマ") || t.includes("鑑賞")) return "🎬";
  return "📌";
}

// ===================== TIMER =====================
const timers = {};

function parseSeconds(timeStr) {
  const m = (timeStr||'').match(/(\d+)/);
  return m ? parseInt(m[1]) * 60 : 600;
}

function formatTime(s) {
  const m = Math.floor(Math.abs(s) / 60);
  const sec = Math.abs(s) % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function toggleTimer(taskId, totalSecs) {
  if (!timers[taskId]) timers[taskId] = { total:totalSecs, remaining:totalSecs, running:false, interval:null };
  const t = timers[taskId];
  if (t.running) {
    clearInterval(t.interval); t.running = false;
  } else {
    if (t.remaining <= 0) t.remaining = t.total;
    t.running = true;
    t.interval = setInterval(() => {
      t.remaining--;
      updateTimerUI(taskId);
      if (t.remaining <= 0) { clearInterval(t.interval); t.running = false; timerFinished(taskId); }
    }, 1000);
  }
  updateTimerUI(taskId);
}

function resetTimer(taskId, totalSecs) {
  if (timers[taskId]) clearInterval(timers[taskId].interval);
  timers[taskId] = { total:totalSecs, remaining:totalSecs, running:false, interval:null };
  const display = document.getElementById(`td-${taskId}`);
  const btn     = document.getElementById(`tb-${taskId}`);
  if (display) { display.textContent = formatTime(totalSecs); display.className = 'timer-display'; }
  if (btn)     { btn.textContent = '▶'; btn.className = 'timer-btn'; }
}

function updateTimerUI(taskId) {
  const t = timers[taskId]; if (!t) return;
  const display = document.getElementById(`td-${taskId}`);
  const btn     = document.getElementById(`tb-${taskId}`);
  if (!display || !btn) return;
  display.textContent = formatTime(t.remaining);
  display.className = 'timer-display' + (t.remaining<=0 ? ' finished' : t.running && t.remaining<=30 ? ' urgent' : t.running ? ' running' : '');
  btn.textContent = t.running ? '⏸' : '▶';
  btn.className   = 'timer-btn' + (t.running ? ' running' : '');
}

function timerFinished(taskId) {
  playTimerSound();
  const display = document.getElementById(`td-${taskId}`);
  if (display) { display.textContent = '完了！'; display.className = 'timer-display finished'; }
  const item = document.querySelector(`[data-task-id="${taskId}"]`);
  if (item) {
    item.style.transition = 'box-shadow 0.3s';
    item.style.boxShadow = '0 0 0 3px var(--success)';
    setTimeout(() => { item.style.boxShadow = ''; }, 1800);
  }
  showToast('⏰ 時間になりました！チェックして次へ進もう！');
}

function showToast(msg) {
  const existing = document.querySelector('.toast-msg');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2800);
}

  {emoji:'🤝', text:'「ミラーニューロン」は他者の行動を観察するだけで発火する神経細胞。共感・模倣・言語学習の基盤で、「社会脳」の基礎とも呼ばれる。'},

  {emoji:'🔐', text:'「確証バイアス」：人は自分の既存の信念を支持する情報を無意識に求め、矛盾する情報を無視する傾向がある。ソーシャルメディアの「エコーチェンバー」はこれを増幅させる。'},
  {emoji:'💬', text:'コミュニケーションの研究では言葉そのものよりも、声のトーン・表情・姿勢が与える印象の方が大きいとされる（メラビアンの法則）。ただしこれは感情表現の文脈に限定される。'},
  {emoji:'🌱', text:'「成長マインドセット」（Carol Dweck）：能力は固定ではなく努力で伸ばせると信じることで、実際にパフォーマンスが向上する。「まだできない」というフレーミングが学習を加速させる。'},
  {emoji:'⏰', text:'人間の時間感覚は感情状態によって変わる。楽しい時は速く、退屈・恐怖時はゆっくり感じる。これは注意資源の配分が変わることで脳の「内部クロック」の刻み方が変化するため。'},
  // === 追加: テクノロジー ===
  {emoji:'🖥️', text:'最初のコンピュータ「ENIAC」（1945年）は重さ30トン、18,000本の真空管を使い、部屋全体を占拠した。現在のスマートフォンはこれの1兆倍以上の計算能力を持つ。'},
  {emoji:'🌐', text:'インターネットの前身「ARPANET」は1969年、米国防総省が核攻撃後も通信を継続するために開発した。最初の送信は「LOGIN」の最初の2文字「LO」でシステムがクラッシュした。'},
  {emoji:'🤖', text:'「人工知能」という言葉は1956年のダートマス会議で生まれた。当時の研究者は「10年以内に機械が人間のように考えられる」と予測したが、それは70年近く経った今も議論中。'},
  {emoji:'📱', text:'現在地球上に稼働しているスマートフォンは約68億台。2007年に初代iPhoneが発売されてから17年足らずで、世界人口の約85%が携帯電話を持つようになった。'},
  {emoji:'🔋', text:'リチウムイオン電池を開発した吉野彰氏はノーベル化学賞（2019年）を受賞。この電池なしにスマートフォン・電気自動車・再生可能エネルギーの普及はなかった。'},
  {emoji:'🛡️', text:'量子コンピュータが実用化されると、現在の暗号通信（RSA暗号）の多くが破られる可能性がある。これを防ぐ「耐量子暗号」の標準化が世界規模で進んでいる。'},
  {emoji:'🧬', text:'CRISPR-Cas9遺伝子編集技術は「分子のはさみ」と呼ばれる。2020年にノーベル化学賞受賞。遺伝疾患治療への応用が期待される一方、デザイナーベビーへの懸念も高まっている。'},
  {emoji:'🚗', text:'自動運転車の倫理問題「トロッコ問題」：ブレーキが効かない場合、1人を犠牲にして5人を救うか？機械にこの判断を委ねることの倫理的問題は未解決のまま開発が進む。'},
  // === 追加: スポーツ ===
  {emoji:'⚽', text:'サッカーは世界で最も人気のあるスポーツで、約40億人のファンがいるとされる。2022年カタールW杯の決勝戦（アルゼンチン対フランス）は史上最多の15億人が視聴した。'},
  {emoji:'🏊', text:'水泳の「バタフライ」泳法は1952年以降に生まれた。もともと平泳ぎの変形として生まれたが、速すぎるため独立した種目になった。それでも最も体力を消耗する泳ぎ方とされる。'},
  {emoji:'🏀', text:'バスケットボールはカナダ人コーチのジェームズ・ネイスミスが1891年に発明。最初のゴールは実際の桃のカゴで、ボールが入るたびに人が上に登って取り出す必要があった。'},
  {emoji:'🎾', text:'テニスの「ラブ（0点）」の語源は諸説あり、フランス語の「卵（l\'œuf）」から派生したという説と、「愛のため（for love）に遊ぶ」という説がある。'},
  {emoji:'🏋️', text:'人間の最大筋力は緊急時に制限が解除される。「火事場の馬鹿力」は実在し、極度のストレス下でアドレナリンが分泌され、通常は脳が保護のため制限している力が発揮される。'},
  {emoji:'🧗', text:'フリーソロクライミングでエル・キャピタン（900m）を初登頂したアレックス・オノルドは、脳スキャンで恐怖を感じる扁桃体の活動が通常の人より著しく低いことが判明している。'},
  {emoji:'🎯', text:'アーチェリーは人類最古の競技の一つで、少なくとも1万年の歴史がある。戦争・狩猟の道具から始まり、現代オリンピックでは近代技術を使った精密スポーツへと進化した。'},
  {emoji:'⛷️', text:'スキーは約8,000年前の北欧・中央アジアで移動手段として発明された。現代の競技スキーに発展したのは19世紀ノルウェーで、世界最初のスキー競技会は1767年に開催された。'},
  // === 追加: 数学 ===
  {emoji:'♾️', text:'無限には大きさがある。カントールの対角線論法により、実数の無限（連続無限）は自然数の無限（可算無限）より「大きい」ことが証明されている。無限にも階層がある。'},
  {emoji:'🎲', text:'モンティ・ホール問題：ドアが3つあり1つに車が。1つ選んだ後、司会がハズレのドアを開ける。ドアを変えるべきか？答えは「変えるべき」（確率2/3）。多くの数学者も最初は直感で間違える。'},
  {emoji:'📐', text:'ユークリッドの「原論」（紀元前300年頃）は数学史上最も影響力のある教科書。5つの公理から始まる演繹体系は2000年以上使われ続け、「数学的証明」の概念を確立した。'},
  {emoji:'🌀', text:'マンデルブロート集合は数式z→z²+cの繰り返しから生まれる。どこまで拡大しても自己相似的な複雑さが現れ、単純なルールから無限の複雑さが生まれる「フラクタル」の代表例。'},
  {emoji:'🎴', text:'確率論はギャンブルから生まれた。17世紀フランスのパスカルとフェルマーが賭博の勝負を数学的に分析したことが確率論の出発点となり、現代の統計・金融・保険の基礎を築いた。'},
  {emoji:'🔢', text:'ゴールドバッハの予想（1742年）：「2より大きいすべての偶数は2つの素数の和で表せる」はまだ証明も反例も見つかっていない。4=2+2、6=3+3…と確認できるが無限の証明は未解決。'},
  {emoji:'📊', text:'統計的有意性（p値<0.05）は「95%の確率で正しい」を意味しない。「帰無仮説が真の場合にこれほど極端な結果が出る確率が5%未満」を意味する。多くの科学者もこれを誤解している。'},
  {emoji:'🔵', text:'四色定理（1976年）は世界初のコンピュータ証明。どんな地図も4色以内で隣接する領域が同色にならないよう塗れるという定理で、人間が手で確認できないほどの場合分けをコンピュータが処理した。'},
  // === 追加: 地理 ===
  {emoji:'🏔️', text:'エベレストは標高8,848mで地球最高峰だが、地球の中心から最も遠い山頂はエクアドルのチンボラソ山（6,263m）。地球は赤道方向に膨らんでいるため赤道近くの山が中心から遠い。'},
  {emoji:'🌊', text:'太平洋は地球上の全大陸を合わせた面積より広い。地球の水の約46%を占め、最深部のマリアナ海溝（約11,000m）はエベレストを沈めても頂上が海面下1,000m以上になる。'},
  {emoji:'🏝️', text:'グリーンランドは名前に反して大部分が氷に覆われ、アイスランドは名前に反して比較的緑が多い。これはバイキングが意図的に人を惑わすように命名したとも、単純な誤解とも言われる。'},
  {emoji:'🗻', text:'富士山は独立峰のように見えるが、実は3つの異なる火山（古富士・新富士・先小御岳）が重なった複成火山。現在の姿になったのは約1万年前。最後の噴火は1707年（宝永大噴火）。'},
  {emoji:'🌋', text:'環太平洋火山帯（「火の輪」）は太平洋を取り囲む地震・火山活動の多い地域。世界の活火山の75%、地震の90%がここに集中している。日本はこの帯上に位置する。'},
  {emoji:'🏜️', text:'サハラ砂漠は世界最大の砂漠のイメージがあるが、実はそれは「熱帯砂漠」として最大。砂漠を「年間降水量250mm以下の地域」と定義すると、南極大陸（年間降水量50mm以下）が世界最大の砂漠。'},
  {emoji:'🌍', text:'アフリカ大陸は実際には地図が示すよりはるかに大きい。メルカトル図法は高緯度地域を拡大する。実際のアフリカは米国・中国・インド・ヨーロッパ・日本を全部合わせたより広い。'},
  {emoji:'🗼', text:'東京は世界最大の都市圏（約3,700万人）だが、行政区域としての「東京都」の人口は約1,400万人。都市圏人口には埼玉・千葉・神奈川・茨城の一部も含まれる。'},
  // === 追加: 芸術・音楽 ===
  {emoji:'🎵', text:'モーツァルトは35年の短い生涯で600曲以上を作曲した。5歳から作曲を始め、35歳で亡くなるまで1年平均17曲以上という驚異的なペースで作品を残した。'},
  {emoji:'🖼️', text:'モナリザには眉毛がない。当時の流行で眉毛を剃るのがエレガントとされたという説と、長年の洗浄・修復で消えたという説がある。また最近の研究で眉毛があった痕跡が発見されている。'},
  {emoji:'🎭', text:'シェイクスピアは約1,700の英単語を発明したとされる。「bedroom（寝室）」「lonely（孤独な）」「obscene（わいせつな）」「uncomfortable（不快な）」なども彼の作品が初出とされる。'},
  {emoji:'🎬', text:'映画「サイレントヒル」などホラーゲーム音楽で知られる山岡晃は、心理的不安を生む「認知的不協和」を意図的に音楽に使う。不快な周波数の組み合わせが本能的な恐怖反応を引き起こす。'},
  {emoji:'🏺', text:'古代ギリシャの建造物は当初は白い大理石と思われていたが、研究により鮮やかに彩色されていたことが判明した。時間とともに色が落ち、18〜19世紀の発掘時にはすでに白くなっていた。'},
  {emoji:'🎸', text:'ビートルズの解散から50年以上経った2023年、「最後のビートルズの新曲」がAIを活用してリリースされた。John Lennonの古い音声から声を復元し、生存するメンバーと共演させる形で制作された。'},
  {emoji:'🖌️', text:'ゴッホが生涯に売れた絵はたった1枚（「赤いブドウ畑」）。死後に名声を得た彼の作品は現在1枚数百億円の価値がある。彼が9年間で残した860点以上の油絵のほとんどが今では世界的名作とされる。'},
  {emoji:'🎻', text:'バッハの「平均律クラヴィーア曲集」は音楽の「旧約聖書」と呼ばれる。西洋音楽の理論的基盤を確立し、ベートーベン・ショパン・ジャズ・ロック・映画音楽まであらゆる音楽に影響を与えた。'},
  // === 追加: 英語・言語 ===
  {emoji:'🗣️', text:'世界には約7,000の言語が存在するが、そのうち約40%が「消滅の危機」にある。平均して2週間に1つの言語が消滅しているとされ、今世紀末までに半数が消えると予測されている。'},
  {emoji:'📚', text:'日本語は世界で最も習得が難しい言語の一つとされる（英語話者向け）。文字体系が3つ（ひらがな・カタカナ・漢字）あり、漢字だけで2,000字以上の常用漢字を使いこなす必要がある。'},
  {emoji:'🔤', text:'英語のアルファベット26文字は古代フェニキア文字→ギリシャ文字→ラテン文字と約3,000年かけて進化した。現代英語のAはもともと牛の頭（αleph）を表していた。'},
  {emoji:'💭', text:'翻訳が難しい言葉の例：ポルトガル語「Saudade（サウダージ）」＝過去の愛しいものへの郷愁と喜びが混ざった感情。日本語「木漏れ日」＝木の葉の間から差し込む光。どちらも他言語に1語では訳せない。'},
  {emoji:'🌍', text:'「Swahili（スワヒリ語）」は東アフリカの共通語で約2億人が話す。アフリカ最大の言語の一つだが、実は話者の大多数が第二言語として学んだもので、母語話者は比較的少ない。'},
  {emoji:'🔡', text:'英語で最も長い1語の単語はニュモノウルトラミクロスコーピックシリコヴォルカノコニオシス（pneumonoultramicroscopicsilicovolcanoconiosis, 45文字）という肺疾患の名前。辞書に載る単語として最長とされる。'},
  {emoji:'🎓', text:'敬語（Honorifics）は日本語で特に発達しているが、実は多くの言語に存在する。フランス語のtu/vous、ドイツ語のdu/Sie、韓国語の다양한 경어体など、社会的関係を言語で表現するのは普遍的文化。'},
  {emoji:'📖', text:'「Oxford English Dictionary」は英語の単語を100万語以上収録。最初の完全版完成（1928年）まで70年以上かかった。ボランティアからの70万件以上の引用例提出という市民参加型の大プロジェクトだった。'},
  {emoji:'🔊', text:'英語のアクセントはソーシャルメディアの影響で急速に変化している。特に若者の間では「フォニー（偽物）アクセント」や「インターネットスピーク」が現実世界の発音に影響を与え始めている。'},
  // === 追加: 雑学・不思議 ===
  {emoji:'🎰', text:'宝くじで当選する確率（約1億分の1）は、雷に2回打たれる確率（約900万分の1）より低い。人間は確率の直感が苦手で、感情的に印象的な出来事を過大評価する（可用性ヒューリスティック）。'},
  {emoji:'🌌', text:'もし太陽が直径1mのボールに縮小された場合、最も近い恒星（プロキシマ・ケンタウリ）は約289kmの距離になる。宇宙がいかに「空っぽ」かを示すスケール感。'},
  {emoji:'⏳', text:'クレオパトラが生きた時代は、現代より古代ローマのコロッセオ（80年完成）建設に近い。ピラミッド完成（紀元前2560年頃）から彼女の時代（紀元前69〜30年）の方が、彼女から現代よりも遠い。'},
  {emoji:'🔥', text:'ろうそくの炎の中心（暗い部分）は実は燃えていない。燃料の気化した部分が燃える前の「未燃ガス」の領域で、炎の外側（明るい部分）が最も温度が高く、中心は比較的低温。'},
  {emoji:'🌏', text:'地図は必ず「嘘をつく」。球体を平面に展開する際には必ず歪みが生じるため、どの地図も面積・形・距離・方向のいずれかを犠牲にしている。完全に正確な地図は3次元の地球儀のみ。'},
  {emoji:'🎪', text:'「6次の隔たり」（6 degrees of separation）：世界のどんな2人も平均6人の知人を介してつながっているという仮説。SNSの発展により現在は「3.5次の隔たり」まで縮まったという研究もある。'},
  {emoji:'💰', text:'お金は細菌の温床。流通する紙幣の平均的な細菌数は1枚あたり数千〜数万個。ドル紙幣の研究では3,000種以上の細菌が検出された。電子マネーが衛生面でも普及する理由の一つ。'},
  {emoji:'🦷', text:'人間の指紋と同様に、舌紋（舌の模様）も個人を特定できる。また虹彩・耳の形・声紋・歩き方（歩容）なども個人識別に使える。生体認証の可能性は指紋・顔以外にも広がっている。'},

  {emoji:'🔭', text:'NASAのボイジャー1号は1977年に打ち上げられ、2012年に太陽圏を出て星間空間に到達した。現在地球から約240億km離れた場所を秒速約17kmで飛び続けている。'},
  {emoji:'🦎', text:'カメレオンが体色を変えるのは擬態のためだけでなく、体温調節・コミュニケーション・感情表現のためでもある。色変化は皮膚内のナノ結晶の配置が変わることで起きる。'},
  {emoji:'🏯', text:'江戸時代（1603〜1868年）の日本は約260年間ほぼ鎖国状態を維持し、国内で独自の文化・芸術・技術が発展した。この平和な時代に歌舞伎・浮世絵・俳句などの文化が花開いた。'},
  {emoji:'🫀', text:'人間の血液型（ABO式）は20世紀初頭に発見されたが、実は人体には血液型以外にも数十種類の血液型システムが存在する。輸血医学ではこれらすべての適合を考慮する必要がある。'},
  {emoji:'🌮', text:'メキシコ料理が2010年にユネスコ無形文化遺産に登録された。フランス料理・地中海料理・日本料理などとともに、料理が「無形文化遺産」として認められる時代になっている。'},
  {emoji:'🧘', text:'マインドフルネス瞑想の研究では、8週間の実践でストレスと不安が減少し、灰白質の密度が増加することが確認されている。現代医学で最も科学的証拠の多い非薬物療法の一つ。'},
  {emoji:'💾', text:'1956年に初めて発売されたハードディスクは重さ1トン、容量わずか5MB。現在のスマートフォンのストレージ（64GB〜数TB）と比べると技術の進歩の凄まじさがわかる。'},
  {emoji:'🏄', text:'サーフィンは約2000年前のポリネシア・ハワイで始まったと考えられる文化的実践。ヨーロッパ人の到来で一時禁止されたが、20世紀に復活し世界中に広まった。2020年東京五輪から正式種目。'},
  {emoji:'🔮', text:'数学の「ゼロ」の概念は古代インドで確立され（西暦628年頃）、アラビア語を経てヨーロッパに伝わった。ゼロなしには現代数学・コンピュータ・物理学はすべて不可能だった。'},
  {emoji:'🌐', text:'バチカン市国は面積約0.44km²（皇居の約3分の2）で世界最小の独立国家。人口は約800人。独自の郵便制度・銀行・放送局（バチカン放送）・鉄道を持つれっきとした独立国。'},
  {emoji:'🎼', text:'ベートーベンは完全に耳が聞こえなくなってから「第九交響曲」を作曲した。音楽の振動を感じ、楽器の音を頭の中に「聴く」方法で、人類史上最も有名な交響曲の一つを生み出した。'},
  {emoji:'✍️', text:'英語の「OK」は世界で最も多く使われる言葉の一つとされる。語源は諸説あり、最有力説は1839年にボストン新聞が「all correct」のユーモア誤綴り「oll korrect」を略したもの。'},
  {emoji:'🎪', text:'古代オリンピックは紀元前776年から紀元後393年まで約1,000年以上続いた。競技は走る・投げる・格闘など基本競技のほか、戦車レース・音楽・詩などの芸術競技も含まれていた。'},

function getNextFact() {
  if (shownFactIds.length >= FUN_FACTS.length) shownFactIds = [];
  const remaining = FUN_FACTS.map((_,i)=>i).filter(i=>!shownFactIds.includes(i));
  const idx = remaining[Math.floor(Math.random()*remaining.length)];
  shownFactIds.push(idx);
  return { ...FUN_FACTS[idx], shown: shownFactIds.length, total: FUN_FACTS.length };
}

function showFact() {
  const { emoji, text, shown, total } = getNextFact();

  const overlay = document.createElement('div');
  overlay.className = 'fact-overlay';
  overlay.innerHTML = `
    <div class="fact-card">
      <div class="fact-tag">✨ タスク完了！ &nbsp;·&nbsp; 英語雑学 ${shown}/${total}</div>
      <span class="fact-emoji-big">${emoji}</span>
      <div class="fact-body">${text}</div>
      <div class="fact-count">これで ${shown} 個の雑学をゲット！残り ${total - shown} 個</div>
      <button class="fact-close" onclick="closeFact(this.closest('.fact-overlay'))">よし、次も頑張ろう！ 🚀</button>
      <div class="fact-progress-bar"><div class="fact-progress-fill" id="fpf"></div></div>
    </div>
  `;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFact(overlay); });
  document.body.appendChild(overlay);

  spawnFactSparkles(overlay);

  let pct = 100;
  const fillEl = overlay.querySelector('#fpf');
  const ivl = setInterval(() => {
    pct -= 100 / 120; // 12 seconds
    if (fillEl) fillEl.style.width = Math.max(0, pct) + '%';
    if (pct <= 0) { clearInterval(ivl); closeFact(overlay); }
  }, 100);
  overlay._ivl = ivl;
}

function closeFact(overlay) {
  if (!overlay || overlay._closing) return;
  overlay._closing = true;
  clearInterval(overlay._ivl);
  overlay.classList.add('closing');
  setTimeout(() => overlay.remove(), 220);
}

function spawnFactSparkles(overlay) {
  const emojis = ['⭐','✨','🌟','💫','🎉','🎊'];
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'fact-sparkle';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const tx = (Math.random()-0.5)*200;
      const ty = -(80 + Math.random()*120);
      el.style.cssText = `bottom:${120+Math.random()*80}px;left:${20+Math.random()*60}%;--tx:${tx}px;--ty:${ty}px;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }, i * 80);
  }
}


// ===================== TIMER SOUND =====================
function playTimerSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[523.25,0],[659.25,0.18],[783.99,0.36],[1046.5,0.54]].forEach(([freq, delay]) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + delay;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      osc.start(t); osc.stop(t + 0.6);
    });
  } catch(e) {}
}

function getTaskDetail(task) {
  return TASK_DETAILS[task.type] || null;
}

function toggleDetail(taskId, event) {
  event.stopPropagation();
  var btn = document.getElementById("dbtn-" + taskId);
  var panel = document.getElementById("dpanel-" + taskId);
  if (!btn || !panel) return;
  var isOpen = panel.classList.contains("open");
  panel.classList.toggle("open", !isOpen);
  btn.classList.toggle("open", !isOpen);
  btn.textContent = isOpen ? "詳細 ▾" : "詳細 ▴";
}

// ===================== STATE =====================
let startDate = null;
let completedTasks = {};
let currentPhase = 0;
let currentFilter = 'all';
let theme = 'light';

function loadState() {
  const sd = localStorage.getItem('eng_start_date');
  if (sd) startDate = new Date(sd);
  completedTasks = JSON.parse(localStorage.getItem('eng_completed') || '{}');
  theme = localStorage.getItem('eng_theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
}

function saveCompleted() {
  localStorage.setItem('eng_completed', JSON.stringify(completedTasks));
}

function getTodayDayNum() {
  if (!startDate) return 1;
  const now = new Date();
  const diff = Math.floor((now - startDate) / (1000*60*60*24));
  return Math.max(1, Math.min(365, diff+1));
}

function getPhaseForDay(d) {
  if (d<=90) return 0;
  if (d<=180) return 1;
  if (d<=270) return 2;
  return 3;
}

function getDayData(dayNum) {
  for (const phase of PROGRAM) {
    for (const week of phase.weeks) {
      for (const day of week.days) {
        if (day.day === dayNum) return {day, week, phase};
      }
    }
  }
  return null;
}

function getDayCompletedCount(dayNum) {
  let total=0, done=0;
  const data = getDayData(dayNum);
  if (!data) return {total:0,done:0};
  data.day.tasks.forEach(t => { total++; if (completedTasks[t.id]) done++; });
  return {total,done};
}

function calcStreak() {
  if (!startDate) return 0;
  const today = getTodayDayNum();
  let streak = 0;
  for (let d=today; d>=1; d--) {
    const {total,done} = getDayCompletedCount(d);
    if (total>0 && done/total >= 0.5) streak++;
    else if (d<today) break;
  }
  return streak;
}

function calcOverall() {
  let total=0, done=0;
  PROGRAM.forEach(p => p.weeks.forEach(w => w.days.forEach(d => {
    d.tasks.forEach(t => { total++; if (completedTasks[t.id]) done++; });
  })));
  return {total,done,pct: total>0 ? Math.round(done/total*100) : 0};
}

function calcWeek() {
  const todayDay = getTodayDayNum();
  const weekStart = Math.floor((todayDay-1)/7)*7+1;
  const weekEnd = weekStart+6;
  let total=0, done=0;
  for (let d=weekStart; d<=weekEnd; d++) {
    const c = getDayCompletedCount(d);
    total+=c.total; done+=c.done;
  }
  return {total,done,pct: total>0 ? Math.round(done/total*100) : 0};
}

// ===================== UI =====================
function setStartDate() {
  const v = document.getElementById('start-date-input').value;
  if (!v) { alert('開始日を選択してください'); return; }
  startDate = new Date(v);
  localStorage.setItem('eng_start_date', v);
  showMainApp();
}

function showMainApp() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  updateHeader();
  showPhase(0);
}

function updateHeader() {
  const today = getTodayDayNum();
  const streak = calcStreak();
  const overall = calcOverall();
  const week = calcWeek();
  document.getElementById('streak-badge').textContent = `🔥 ${streak}日連続`;
  document.getElementById('day-badge').textContent = `Day ${today}`;
  document.getElementById('total-badge').textContent = `${overall.pct}% 達成`;
  document.getElementById('stat-overall').textContent = `${overall.pct}%`;
  document.getElementById('stat-overall-sub').textContent = `${overall.done} / ${overall.total} タスク`;
  document.getElementById('bar-overall').style.width = overall.pct+'%';
  document.getElementById('stat-week').textContent = `${week.pct}%`;
  document.getElementById('stat-week-sub').textContent = `${week.done} / ${week.total} タスク（今週）`;
  document.getElementById('bar-week').style.width = week.pct+'%';
  document.getElementById('stat-days').textContent = today;
  document.getElementById('bar-days').style.width = (today/365*100)+'%';
  document.getElementById('stat-streak').textContent = `🔥 ${streak}`;
  updateTodayCard();
}

function updateTodayCard() {
  const today = getTodayDayNum();
  const data = getDayData(today);
  if (!data) return;
  const {day,week,phase} = data;
  const {total,done} = getDayCompletedCount(today);
  const pct = total>0 ? Math.round(done/total*100) : 0;
  document.getElementById('today-label').textContent = `今日 · Day ${today} · ${new Date().toLocaleDateString('ja-JP')}`;
  document.getElementById('today-title').textContent = day.theme;
  document.getElementById('today-theme').textContent = `${phase.name} · Week ${week.week}`;
  document.getElementById('today-prog-text').textContent = `${done} / ${total} タスク完了`;
  document.getElementById('today-bar').style.width = pct+'%';
  document.getElementById('today-card').style.background = done===total && total>0
    ? 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)'
    : 'linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%)';
}

function showPhase(phaseIdx) {
  document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.phase-tab[data-phase="${phaseIdx}"]`).classList.add('active');
  currentPhase = phaseIdx;
  const content = document.getElementById('content-area');
  content.innerHTML = '';

  if (phaseIdx === 0) {
    showTodayView(content);
  } else {
    const phase = PROGRAM[phaseIdx-1];
    const banner = document.createElement('div');
    const colors = ['','#22c55e','#3b82f6','#a855f7','#f97316'];
    const descs = ['','脳科学に基づき音韻・語彙・文法の基礎を確立。1日1〜2時間で頻出英単語2000語と発音の基盤を作る',
      '大量のインプット（多聴・多読・シャドーイング）で英語回路を構築。語彙を3000語に拡張',
      '実際の会話でアウトプットを開始。オンライン英会話・英語日記で流暢さを向上',
      'ネイティブ速度での理解と自然な会話を定着。語彙4000語達成・B1〜B2レベルへ'];
    banner.className = 'phase-banner';
    banner.style.cssText = `background:${colors[phaseIdx]}20; border-color:${colors[phaseIdx]};`;
    banner.innerHTML = `<h3 style="color:${colors[phaseIdx]}">${phase.name} (${phase.days})</h3><p>${descs[phaseIdx]}</p>`;
    content.appendChild(banner);
    phase.weeks.forEach(week => renderWeek(content, week, phase, phaseIdx));
  }
}

function showTodayView(content) {
  const today = getTodayDayNum();
  const data = getDayData(today);
  if (!data) { content.innerHTML = '<p style="color:var(--text2);padding:20px;">データが見つかりません</p>'; return; }
  const {day, week, phase} = data;
  const phaseIdx = getPhaseForDay(today)+1;
  const singleWeek = {week: week.week, theme: week.theme, days: [day]};
  renderWeek(content, singleWeek, phase, phaseIdx, true);
}

function renderWeek(container, week, phase, phaseIdx, autoOpen=false) {
  const today = getTodayDayNum();
  const colors = ['','var(--p1)','var(--p2)','var(--p3)','var(--p4)'];
  const color = colors[phaseIdx] || 'var(--primary)';

  let weekTotal=0, weekDone=0;
  week.days.forEach(d => {
    d.tasks.forEach(t => { weekTotal++; if (completedTasks[t.id]) weekDone++; });
  });
  const weekPct = weekTotal>0 ? Math.round(weekDone/weekTotal*100) : 0;

  const section = document.createElement('div');
  section.className = 'week-section';
  const isCurrentWeek = week.days.some(d => d.day===today);
  if (isCurrentWeek || autoOpen) section.classList.add('open');

  section.innerHTML = `
    <div class="week-header" onclick="toggleWeek(this)">
      <div class="week-badge" style="background:${color}">W${week.week}</div>
      <div class="week-info">
        <div class="week-title">Week ${week.week}：${week.theme}</div>
        <div class="week-sub">Day ${week.days[0]?.day} 〜 Day ${week.days[week.days.length-1]?.day} · ${weekTotal}タスク</div>
      </div>
      <div class="week-progress">
        <div class="week-pct" style="color:${color}">${weekPct}%</div>
        <div style="font-size:0.72rem;color:var(--text2)">${weekDone}/${weekTotal}</div>
      </div>
      <div class="week-chevron">▼</div>
    </div>
    <div class="week-days" id="week-${week.week}-days"></div>
  `;
  container.appendChild(section);

  const daysContainer = section.querySelector(`#week-${week.week}-days`);
  week.days.forEach(day => renderDay(daysContainer, day, today, phaseIdx));
}

function renderDay(container, day, today, phaseIdx) {
  const {total,done} = getDayCompletedCount(day.day);
  const isToday = day.day===today;
  const badgeClass = done===total&&total>0?'complete': done>0?'partial':'todo';
  const badgeText = done===total&&total>0?'✅ 完了': done>0?`${done}/${total}`:'未着手';

  const section = document.createElement('div');
  section.className = 'day-section';
  section.id = `day-${day.day}`;
  if (isToday) section.classList.add('open');

  section.innerHTML = `
    <div class="day-header" onclick="toggleDay(this)">
      <div class="day-num">Day ${day.day}${isToday?'<br><span class="today-marker">TODAY</span>':''}</div>
      <div class="day-name">${day.theme}</div>
      <div class="day-done-badge ${badgeClass}">${badgeText}</div>
      <div class="week-chevron">▼</div>
    </div>
    <div class="day-tasks" id="tasks-day-${day.day}"></div>
  `;
  container.appendChild(section);

  const tasksContainer = section.querySelector(`#tasks-day-${day.day}`);
  day.tasks.forEach(task => renderTask(tasksContainer, task, day.day));
}

function renderTask(container, task, dayNum) {
  if (currentFilter !== 'all' && task.type !== currentFilter) return;
  const isDone = !!completedTasks[task.id];
  const totalSecs = parseSeconds(task.time);
  const detail = getTaskDetail(task);
  let detailHTML = '';
  if (detail) {
    const methodsHTML = detail.methods.map(m => '<li>' + m + '</li>').join('');
    detailHTML =
      '<button id="dbtn-' + task.id + '" class="task-detail-btn" onclick="toggleDetail(\'' + task.id + '\',event)">詳細 ▾</button>' +
      '<div id="dpanel-' + task.id + '" class="task-detail-panel">' +
        '<div class="detail-section"><div class="detail-label">目的</div><div class="detail-text">' + detail.purpose + '</div></div>' +
        '<div class="detail-section"><div class="detail-label">学習方法</div><ul class="detail-methods">' + methodsHTML + '</ul></div>' +
        '<div class="detail-section"><div class="detail-label">ポイント</div><div class="detail-tip">' + detail.tip + '</div></div>' +
      '</div>';
  }
  const item = document.createElement('div');
  item.className = `task-item${isDone?' done':''}`;
  item.setAttribute('data-task-id', task.id);
  item.setAttribute('data-day', dayNum);
  item.onclick = () => toggleTask(task.id, dayNum);
  item.innerHTML = `
    <div class="task-checkbox"></div>
    <div class="task-content">
      <div class="task-header">
        <span class="task-icon">${task.icon}</span>
        <span class="task-type-badge type-${task.type}">${task.type}</span>
        <span class="task-time">⏱ ${task.time}</span>
      </div>
      <div class="task-text">${task.content}</div>
      <div class="task-timer">
        <button id="tb-${task.id}" class="timer-btn" onclick="toggleTimer('${task.id}',${totalSecs});event.stopPropagation()">▶</button>
        <span id="td-${task.id}" class="timer-display">${formatTime(totalSecs)}</span>
        <button class="timer-reset" onclick="resetTimer('${task.id}',${totalSecs});event.stopPropagation()" title="リセット">↺</button>
      </div>
      ${detailHTML}
    </div>
  `;
  container.appendChild(item);
}

function toggleTask(taskId, dayNum) {
  const wasCompleted = !!completedTasks[taskId];
  completedTasks[taskId] = !wasCompleted;
  saveCompleted();

  const item = document.querySelector(`[data-task-id="${taskId}"]`);
  if (item) {
    item.classList.toggle('done', !wasCompleted);
    if (!wasCompleted) {
      item.classList.add('just-done');
      setTimeout(() => item.classList.remove('just-done'), 400);
    }
  }

  const {total,done} = getDayCompletedCount(dayNum);
  const allDone = done===total && total>0;
  if (allDone && !wasCompleted) {
    launchConfetti();
    setTimeout(() => showDailyComplete(), 1200);
  }
  if (!wasCompleted) setTimeout(() => showFact(), allDone ? 2800 : 250);
  updateDayBadge(dayNum);
  updateWeekProgress(dayNum);
  updateHeader();
}

function updateDayBadge(dayNum) {
  const {total,done} = getDayCompletedCount(dayNum);
  const badge = document.querySelector(`#day-${dayNum} .day-done-badge`);
  if (!badge) return;
  badge.className = 'day-done-badge';
  if (done===total&&total>0) { badge.classList.add('complete'); badge.textContent='✅ 完了'; }
  else if (done>0) { badge.classList.add('partial'); badge.textContent=`${done}/${total}`; }
  else { badge.classList.add('todo'); badge.textContent='未着手'; }
}

function updateWeekProgress(dayNum) {
  const data = getDayData(dayNum);
  if (!data) return;
  const weekNum = data.week.week;
  let wt=0,wd=0;
  data.week.days.forEach(d => {
    d.tasks.forEach(t => { wt++; if(completedTasks[t.id]) wd++; });
  });
  const pct = wt>0?Math.round(wd/wt*100):0;
  const weekSec = document.querySelector(`.week-badge[style*="W${weekNum}"]`);
  // find week section by week badge content
  const allBadges = document.querySelectorAll('.week-badge');
  allBadges.forEach(b => {
    if (b.textContent===`W${weekNum}`) {
      const header = b.closest('.week-header');
      if (header) {
        const pctEl = header.querySelector('.week-pct');
        const subEl = header.querySelector('.week-pct + div');
        if (pctEl) pctEl.textContent = pct+'%';
        if (subEl) subEl.textContent = `${wd}/${wt}`;
      }
    }
  });
}

function toggleWeek(header) {
  header.closest('.week-section').classList.toggle('open');
}

function toggleDay(header) {
  header.closest('.day-section').classList.toggle('open');
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const phase = currentPhase;
  showPhase(phase);
}

function scrollToToday() {
  const todayEl = document.getElementById(`day-${getTodayDayNum()}`);
  if (todayEl) {
    todayEl.scrollIntoView({behavior:'smooth', block:'center'});
    todayEl.classList.add('open');
  } else {
    showPhase(0);
    setTimeout(() => {
      const el = document.getElementById(`day-${getTodayDayNum()}`);
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 200);
  }
}

function toggleTheme() {
  theme = theme==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('eng_theme', theme);
  document.querySelector('.theme-btn').textContent = theme==='dark' ? '☀️' : '🌙';
}

function confirmReset() {
  if (confirm('⚠️ すべての進捗がリセットされます。本当によいですか？')) {
    localStorage.clear();
    location.reload();
  }
}

function launchConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#3b82f6'];
  for (let i=0; i<40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay:${Math.random()*0.5}s;
      animation-duration:${1+Math.random()}s;
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    container.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

loadState();

document.getElementById('start-date-input').value = today;

if (startDate) {
  showMainApp();
} else {
  document.getElementById('setup-screen').style.display = 'block';
}
